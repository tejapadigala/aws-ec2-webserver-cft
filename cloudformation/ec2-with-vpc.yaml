AWSTemplateFormatVersion: "2010-09-09"
Description: "Full stack — creates VPC, Subnet, Security Group and EC2 from scratch"

# ─────────────────────────────────────────
# PARAMETERS
# ─────────────────────────────────────────
Parameters:

  InstanceTypeParam:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
      - t2.medium
    Description: "Choose EC2 instance size (t2.micro is free tier)"

  KeyNameParam:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "Select your existing Key Pair to SSH into EC2"

  EnvParam:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: "Deployment environment"

# ─────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────
Resources:

  # ── 1. VPC ──────────────────────────────
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvParam}-VPC"

  # ── 2. Internet Gateway ──────────────────
  MyInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${EnvParam}-IGW"

  # ── 3. Attach IGW to VPC ─────────────────
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref MyInternetGateway

  # ── 4. Public Subnet ─────────────────────
  MyPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: true         # EC2 gets public IP automatically
      Tags:
        - Key: Name
          Value: !Sub "${EnvParam}-PublicSubnet"

  # ── 5. Route Table ───────────────────────
  MyRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvParam}-RouteTable"

  # ── 6. Route (send internet traffic to IGW)
  MyPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref MyRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref MyInternetGateway

  # ── 7. Associate Route Table with Subnet ──
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref MyPublicSubnet
      RouteTableId: !Ref MyRouteTable

  # ── 8. Security Group ────────────────────
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allow SSH and HTTP access"
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp       # SSH
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp       # HTTP
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${EnvParam}-SG"

  # ── 9. EC2 Instance ──────────────────────
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-00403f401ee6a4b98     # Amazon Linux 2 — ap-south-1 (Mumbai)
      InstanceType: !Ref InstanceTypeParam
      KeyName: !Ref KeyNameParam
      SubnetId: !Ref MyPublicSubnet
      SecurityGroupIds:
        - !Ref MySecurityGroup
      MetadataOptions:
        InstanceMetadataTags: enabled
      Tags:
        - Key: Name
          Value: !Sub "${EnvParam}-EC2"
        - Key: department
          Value: dev

# ─────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────
Outputs:

  VPCId:
    Description: "VPC ID"
    Value: !Ref MyVPC

  SubnetId:
    Description: "Public Subnet ID"
    Value: !Ref MyPublicSubnet

  SecurityGroupId:
    Description: "Security Group ID"
    Value: !Ref MySecurityGroup

  EC2InstanceId:
    Description: "EC2 Instance ID"
    Value: !Ref MyEC2Instance

  EC2PublicIP:
    Description: "Public IP — use this to SSH or visit the website"
    Value: !GetAtt MyEC2Instance.PublicIp

AWSTemplateFormatVersion: "2010-09-09"
Description: "Simple EC2 instance using existing Subnet and Security Group"

# ─────────────────────────────────────────
# PARAMETERS — filled in at deploy time
# ─────────────────────────────────────────
Parameters:

  ExistingSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: "Pick an existing subnet from your VPC"

  ExistingSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: "Pick an existing Security Group"

  InstanceTypeParam:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
      - t2.medium
    Description: "Choose EC2 instance size (t2.micro is free tier)"

  KeyNameParam:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "Select your existing Key Pair to SSH into EC2"

# ─────────────────────────────────────────
# RESOURCES — what AWS will create
# ─────────────────────────────────────────
Resources:

  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0236922087fa98b6e       
      InstanceType: !Ref InstanceTypeParam
      KeyName: !Ref KeyNameParam
      SubnetId: !Ref ExistingSubnetId
      SecurityGroupIds:
        - !Ref ExistingSecurityGroupId
      MetadataOptions:
        InstanceMetadataTags: enabled
      Tags:
        - Key: Name
          Value: ec2-basic-cft
        - Key: department
          Value: dev

# ─────────────────────────────────────────
# OUTPUTS — shown after stack is created
# ─────────────────────────────────────────
Outputs:

  EC2InstanceId:
    Description: "EC2 Instance ID"
    Value: !Ref MyEC2Instance

  EC2PublicIP:
    Description: "Public IP of your EC2 instance"
    Value: !GetAtt MyEC2Instance.PublicIp
